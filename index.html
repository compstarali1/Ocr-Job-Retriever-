<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Reg Scanner — Fast Match</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
 --bg:#07090d;--card:#11151c;--line:#29313d;
 --text:#f5f7fa;--muted:#8f9aaa;--cyan:#00d9ff;
 --green:#16e38a;--amber:#ffb020;--scan:#ff2d9a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Roboto,Arial,sans-serif}
body{background:radial-gradient(circle at 50% -10%,#15202b 0,#07090d 45%);color:var(--text);min-height:100vh;padding:12px;max-width:760px;margin:auto}
h1{font-size:1.1rem;color:var(--cyan);margin-bottom:4px}
p{font-size:.76rem;color:var(--muted);margin-bottom:16px}
.panel{background:linear-gradient(145deg,#121820,#0e1218);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel-title{font-size:.86rem;color:#dce3ea;margin-bottom:9px;font-weight:700}
textarea{width:100%;height:130px;background:#080b10;border:1px solid #27303a;color:#fff;border-radius:10px;padding:11px;outline:none;font-size:.86rem;resize:none}
textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #00d9ff22}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:10px;padding:12px 14px;color:white;font-weight:800;cursor:pointer;flex:1;min-width:140px}
.scanbtn{background:linear-gradient(145deg,#ff39aa,#a90068)}
.process{background:linear-gradient(145deg,#00c8ed,#007d9b)}
.clear{background:linear-gradient(145deg,#555e69,#303740)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.stat{background:#10151c;border:1px solid var(--line);border-radius:10px;text-align:center;padding:10px}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.67rem;color:var(--muted)}
#pendingCount{color:var(--amber)}#doneCount{color:var(--green)}#totalCount{color:var(--cyan)}
.list-title{font-size:.86rem;padding:8px 4px 6px;border-bottom:1px solid var(--line);margin:10px 0 5px}
.pending{color:var(--amber)}.done{color:var(--green)}
.item{display:flex;align-items:center;gap:10px;background:linear-gradient(145deg,#141a22,#10151b);border:1px solid #242d38;
border-left:4px solid var(--amber);border-radius:11px;padding:11px;margin-bottom:7px;transition:.2s}
.item.done{border-left-color:var(--green);opacity:.75}
.item.hit{border-color:var(--scan);background:#2f1429;box-shadow:0 0 20px 5px #ff2d9a66;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1.04)}100%{transform:scale(1)}}
.reg{font-size:1rem;font-weight:900;letter-spacing:.7px}
.tick{width:22px;height:22px;border:2px solid #5a6572;border-radius:6px;cursor:pointer;display:grid;place-items:center;flex:none}
.tick.checked{background:var(--green);border-color:var(--green)}.tick.checked:after{content:"✓";font-weight:900;color:#000}
.hidden{display:none!important}

/* Scanner Window */
#scanner{display:none;position:fixed;inset:0;background:#020406ef;z-index:999;align-items:center;justify-content:center;padding:15px}
#scanner.open{display:flex}
.scanbox{width:min(94vw,520px);background:#0c1118;border:1px solid #33404d;border-radius:18px;padding:14px}
.video-wrap{position:relative;background:#000;border-radius:13px;overflow:hidden;aspect-ratio:16/11;margin:10px 0}
#video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:7%;right:7%;top:39%;height:22%;border:3px solid var(--scan);border-radius:9px;box-shadow:0 0 0 999px #0006;pointer-events:none}
.scanline{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff65bd;box-shadow:0 0 10px #ff2d9a;animation:sl 1.5s linear infinite}
@keyframes sl{0%{top:42%}50%{top:58%}100%{top:42%}}
.scan-status{text-align:center;padding:8px;color:#dbe3ea;font-size:.82rem}
.controls{display:flex;gap:8px;margin-top:8px}
.controls button{flex:1}
.close{background:#333}
</style>
</head>
<body>

<h1>🚐 Fast Reg Scanner</h1>
<p>Paste list → Process → Scan → Auto‑jump to match</p>

<div class="panel">
 <div class="panel-title">📋 YOUR REGISTRATION LIST</div>
 <textarea id="regBox" placeholder="NX22ULU&#10;NX22ULV&#10;NX72VGN&#10;one per line…"></textarea>
 <div class="row">
  <button class="btn process" id="processBtn">⚡ PROCESS LIST</button>
  <button class="btn scanbtn" id="openScanBtn">📷 SCAN REG</button>
  <button class="btn clear" id="clearBtn">Clear</button>
 </div>
</div>

<div class="stats">
 <div class="stat"><b id="pendingCount">0</b><span>PENDING</span></div>
 <div class="stat"><b id="doneCount">0</b><span>DONE</span></div>
 <div class="stat"><b id="totalCount">0</b><span>TOTAL</span></div>
</div>

<div class="list-title pending">⏳ PENDING</div>
<div id="pendingList"></div>
<div class="list-title done">✅ COMPLETED</div>
<div id="doneList"></div>

<!-- SCANNER WINDOW -->
<div id="scanner">
 <div class="scanbox">
  <div class="panel-title">📷 AIM AT REG PLATE</div>
  <div class="video-wrap">
   <video id="video" autoplay muted playsinline></video>
   <div class="frame"><div class="scanline"></div></div>
  </div>
  <div class="scan-status" id="scanStatus">Loading camera…</div>
  <div class="controls">
   <button class="btn close" id="closeScan">✕ CLOSE</button>
   <button class="btn scanbtn" id="scanNow">◎ SCAN</button>
  </div>
 </div>
</div>
<canvas id="canvas" style="display:none"></canvas>

<script>
const $=id=>document.getElementById(id);
const regBox=$('regBox'), pendingList=$('pendingList'), doneList=$('doneList');
let items=[], scanning=false, stream=null, lastHit=0;

// Normalise — remove spaces/symbols, uppercase
function clean(s){return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}

// Beep sound
function beep(){
 try{
  const c=new (window.AudioContext||webkitAudioContext);
  const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=880;
  g.gain.setValueAtTime(.3,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);
  o.connect(g).connect(c.destination);
  o.start();o.stop(c.currentTime+.35);
 }catch(e){}
}

// Build list from pasted text
$('processBtn').onclick=()=>{
 items=regBox.value.split('\n')
  .map(r=>clean(r))
  .filter(r=>r.length>4);
 if(!items.length)return alert('Paste registrations first');
 items=items.map(reg=>({reg,done:false}));
 render();
};

$('clearBtn').onclick=()=>{regBox.value='';regBox.focus()};

// Render list
function render(){
 pendingList.innerHTML='';doneList.innerHTML='';
 items.forEach((item,i)=>{
  const el=document.createElement('div');
  el.className=`item ${item.done?'done':''}`;
  el.dataset.reg=item.reg;
  el.innerHTML=`
   <div class="tick ${item.done?'checked':''}" onclick="toggle(${i})"></div>
   <div class="reg">${item.reg}</div>`;
  (item.done?doneList:pendingList).appendChild(el);
 });
 $('pendingCount').textContent=items.filter(i=>!i.done).length;
 $('doneCount').textContent=items.filter(i=>i.done).length;
 $('totalCount').textContent=items.length;
}

function toggle(i){items[i].done=!items[i].done;render()}

// --- SCANNER ---
$('openScanBtn').onclick=async()=>{
 $('scanner').classList.add('open');
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'environment',width:1280,height:720},audio:false
  });
  $('video').srcObject=stream;
  scanning=true;
  $('scanStatus').textContent='Plate in the pink box → Scan';
 }catch(e){
  $('scanStatus').textContent='❌ Camera blocked — allow camera & use HTTPS';
 }
};

$('closeScan').onclick=()=>{
 scanning=false;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 $('video').srcObject=null;
 $('scanner').classList.remove('open');
};

$('scanNow').onclick=async()=>{
 if(!scanning)return;
 $('scanStatus').textContent='Reading…';

 // Crop frame to scan area
 const v=$('video'),c=$('canvas');
 if(!v.videoWidth)return;
 const w=v.videoWidth,h=v.videoHeight;
 const sx=Math.round(w*.07),sy=Math.round(h*.39),sw=Math.round(w*.86),sh=Math.round(h*.22);
 c.width=sw;c.height=sh;
 const ctx=c.getContext('2d');
 ctx.drawImage(v,sx,sy,sw,sh,0,0,sw,sh);

 // OCR — FAST minimal config
 const result=await Tesseract.recognize(c,'eng',{
  logger:()=>{},
  tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
  tessedit_pageseg_mode:6
 });

 const found=clean(result.data.text);
 // Match against list
 const match=items.find(i=>found.includes(i.reg));

 if(match && Date.now()-lastHit>2500){ // prevent double trigger
  lastHit=Date.now();
  beep();
  $('scanStatus').textContent='✅ MATCH: '+match.reg;

  // Highlight & scroll to it
  document.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
  const el=document.querySelector(`[data-reg="${match.reg}"]`);
  if(el){
   el.classList.add('hit');
   el.scrollIntoView({behavior:'smooth',block:'center'});
   setTimeout(()=>el.classList.remove('hit'),3000);
  }

  setTimeout(()=>$('closeScan').click(),1200); // auto-close scanner
 }else{
  $('scanStatus').textContent=found.slice(0,12)||'No reg read — try again';
 }
};
</script>
</body>
</html>
