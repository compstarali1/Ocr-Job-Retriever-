<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Enfield Dotcom — OCR Scanner ✅ WORKING</title>

<!-- ✅ TESSERACT.JS — REQUIRED FOR OCR → DO NOT REMOVE -->
<script src="assets/tesseract.min.js"></script>

<style>
:root{
 --bg:#07090d;--card:#11151c;--line:#29313d;--text:#f5f7fa;--muted:#8f9aaa;
 --cyan:#00d9ff;--green:#16e38a;--amber:#ffb020;--scan:#ff2d9a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Roboto,Arial,sans-serif}
body{background:radial-gradient(circle at 50% -10%,#15202b 0,#07090d 45%);color:var(--text);min-height:100vh;padding:12px;max-width:760px;margin:auto}
button,input,textarea{font:inherit}
.header{position:relative;padding:17px 58px 16px 16px;border:1px solid #24303b;border-radius:16px;
 background:linear-gradient(145deg,#101923,#0a0d12);margin-bottom:12px}
.header h1{font-size:1.08rem;color:var(--cyan);margin-bottom:3px}
.top-reset{position:absolute;right:12px;top:12px;background:linear-gradient(145deg,#555e69,#303740);border:1px solid #66717d;color:#fff;border-radius:8px;padding:6px 9px;font-size:.65rem;font-weight:900;cursor:pointer}
.panel{background:linear-gradient(145deg,#121820,#0e1218);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.panel-title{font-size:.86rem;color:#dce3ea;margin-bottom:9px;font-weight:700}
textarea{width:100%;height:120px;background:#080b10;border:1px solid #27303a;color:#fff;border-radius:10px;padding:11px;outline:none}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 13px;color:white;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(145deg,#00c8ed,#007d9b)}
.scanbtn{background:linear-gradient(145deg,#ff39aa,#a90068);flex:1;min-width:170px}
.clear{background:linear-gradient(145deg,#555e69,#303740)}
.small{font-size:.76rem;color:var(--muted);margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.stat{background:#10151c;border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px}
.stat b{display:block;font-size:1.25rem}
#pendingCount{color:var(--amber)}#doneCount{color:var(--green)}#totalCount{color:var(--cyan)}
.search{width:100%;background:#0c1016;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px 13px;outline:none;margin-bottom:10px}
.section-title{font-size:.86rem;padding:8px 3px;border-bottom:1px solid var(--line);margin-bottom:7px}
.section-title.pending{color:var(--amber)}.section-title.done{color:var(--green)}
.item{display:flex;align-items:center;gap:9px;background:linear-gradient(145deg,#141a22,#10151b);border:1px solid #242d38;
border-left:4px solid var(--amber);border-radius:11px;padding:10px;margin-bottom:7px;transition:.2s}
.item.done{border-left-color:var(--green);opacity:.72}
.item.scan-hit{animation:hit 2s ease;outline:4px solid var(--scan);background:#30152a}
@keyframes hit{0%{transform:scale(1.03)}100%{transform:scale(1)}}
.num{min-width:32px;text-align:center;background:#202832;border-radius:7px;padding:5px 3px;color:#aab4c0;font-size:.72rem}
.tick{width:22px;height:22px;border:2px solid #5a6572;border-radius:6px;cursor:pointer;display:grid;place-items:center}
.tick.checked{background:var(--green);border-color:var(--green)}.tick.checked:after{content:"✓";font-weight:900;color:#00170d}
.reg{font-size:1rem;font-weight:900;letter-spacing:.7px}
.hidden{display:none!important}
#scanner{display:none;position:fixed;inset:0;background:#020406eF;z-index:1000;align-items:center;justify-content:center;padding:15px}
#scanner.open{display:flex}
.scanbox{width:min(94vw,520px);background:#0c1118;border:1px solid #33404d;border-radius:18px;padding:16px}
.video-wrap{position:relative;background:#000;border-radius:13px;overflow:hidden;aspect-ratio:16/11;margin-bottom:12px}
#video{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;left:10%;right:10%;top:40%;height:20%;border:3px solid var(--scan);border-radius:9px}
.scan-status{text-align:center;padding:10px 4px;min-height:50px}
.scan-status.ready{color:var(--green)}.scan-status.error{color:var(--red)}
.scanner-controls{display:flex;gap:8px;margin-top:10px}.scanner-controls button{flex:1}
.close{background:linear-gradient(145deg,#555,#292e34)}
.manual-wrap{margin-top:12px;padding-top:12px;border-top:1px solid #2a3442}
.manual-input{width:100%;background:#080b10;border:1px solid #27303a;color:#fff;border-radius:8px;padding:10px;font-size:1.1rem;font-weight:700;text-align:center;margin:6px 0}
.manual-btn{background:linear-gradient(145deg,#16e38a,#00a86b);width:100%}
#ocrCanvas{display:none}
</style>
</head>
<body>

<header class="header">
 <button id="resetBtn" class="top-reset" type="button">↻ RESET</button>
 <h1>🚐 Enfield Dotcom — OCR Scanner</h1>
 <p>✅ Tesseract.js Ready — Scan or Type to Match</p>
</header>

<section class="panel">
 <div class="panel-title">📋 JOB REGISTRATIONS</div>
 <textarea id="rawText" placeholder="Paste list here…&#10;NX22URV - DONE&#10;NX22ULU"></textarea>
 <div class="row">
  <button class="btn primary" id="processBtn">⚡ PROCESS LIST</button>
  <button class="btn clear" id="clearBtn">Clear</button>
  <button class="btn scanbtn" id="openScannerBtn">📷 SCAN REG</button>
 </div>
 <div class="small">💡 OCR loads once → instant after first time</div>
</section>

<div class="stats">
 <div class="stat"><b id="pendingCount">0</b><span>PENDING</span></div>
 <div class="stat"><b id="doneCount">0</b><span>DONE</span></div>
 <div class="stat"><b id="totalCount">0</b><span>TOTAL</span></div>
</div>

<input id="search" class="search" placeholder="🔍 Type registration — instant!">

<section>
 <div class="section-title pending">⏳ TO DO</div>
 <div id="pendingList"></div>
</section>
<section>
 <div class="section-title done">✅ COMPLETED</div>
 <div id="doneList"></div>
</section>

<div id="scanner">
 <div class="scanbox">
  <div class="panel-title">📷 AIM AT PLATE</div>
  <div class="video-wrap">
   <video id="video" autoplay muted playsinline></video>
   <div class="overlay"></div>
  </div>
  <div class="scan-status" id="scanStatus">Checking OCR engine…</div>
  <div class="scanner-controls">
   <button class="btn close" id="closeScanner">✕ CLOSE</button>
   <button class="btn scanbtn" id="scanNow">◎ SCAN NOW</button>
  </div>
  
  <div class="manual-wrap">
   <div class="panel-title" style="margin-bottom:4px">⚡ FASTER — JUST TYPE IT</div>
   <input type="text" id="manualReg" class="manual-input" placeholder="e.g. NX22ULU" maxlength="8">
   <button class="btn manual-btn" id="manualMatchBtn">✅ FIND & MATCH — INSTANT</button>
  </div>
 </div>
</div>
<canvas id="ocrCanvas"></canvas>

<script>
const KEY='enfield-ocr-v5';
let items=[];
let stream=null, worker=null, isProcessing=false;
const $=id=>document.getElementById(id);

// ✅ CHECK TESSERACT IS LOADED
function checkTesseract(){
 if(!window.Tesseract){
  alert('❌ Tesseract.js NOT FOUND!\nCheck the script tag in your HTML.');
  return false;
 }
 return true;
}

function norm(s){return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function validReg(s){return /^[A-Z]{2}\d{2}[A-Z0-9]{3}$/.test(norm(s));}
function parse(text){
 const out=[], seen=new Set();
 const re=/\b([A-Z]{2}\s*\d{2}\s*[A-Z0-9]{3})\b/gi;
 let m;
 while((m=re.exec(text))){
   const reg=norm(m[1]);
   if(validReg(reg)&&!seen.has(reg)){
     out.push({reg,done:/-?\s*DONE\b/i.test(text.slice(Math.max(0,m.index-20),m.index+30))});
     seen.add(reg);
   }
 }
 return out;
}
function save(){localStorage.setItem(KEY,JSON.stringify({items,raw:$('rawText').value}));}
function load(){
 try{
  const d=JSON.parse(localStorage.getItem(KEY)||'{}');
  if(d?.items?.length){items=d.items;$('rawText').value=d.raw||'';render();}
 }catch(e){}
}
function render(){
 $('pendingList').innerHTML='';$('doneList').innerHTML='';
 items.forEach((x,i)=>{
   const el=document.createElement('div');
   el.className='item '+(x.done?'done':'pending');
   el.dataset.reg=x.reg;
   el.innerHTML=`<div class="num">${i+1}</div><div class="tick ${x.done?'checked':''}"></div><div><div class="reg">${x.reg}</div></div>`;
   el.querySelector('.tick').onclick=()=>{items[i].done=!items[i].done;save();render();};
   (x.done?$('doneList'):$('pendingList')).appendChild(el);
 });
 $('pendingCount').textContent=items.filter(x=>!x.done).length;
 $('doneCount').textContent=items.filter(x=>x.done).length;
 $('totalCount').textContent=items.length;
 filter();
}
function filter(){
 const q=norm($('search').value);
 document.querySelectorAll('.item').forEach(el=>el.classList.toggle('hidden',q&&!norm(el.dataset.reg).includes(q)));
}
function beep(){
 try{const c=new (window.AudioContext||webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();
 o.frequency.value=880;g.gain.setValueAtTime(.001,c.currentTime);g.gain.linearRampToValueAtTime(.3,c.currentTime+.05);
 g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){}
}
function matchAndHighlight(reg){
 const found=items.find(x=>norm(x.reg)===norm(reg));
 if(!found){alert(`❌ ${reg} — NOT FOUND`);return;}
 beep();
 alert(`✅ MATCH: ${found.reg}`);
 stopCamera();
 document.querySelectorAll('.scan-hit').forEach(x=>x.classList.remove('scan-hit'));
 const el=document.querySelector(`.item[data-reg="${found.reg}"]`);
 if(el){el.classList.add('scan-hit');el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>el.classList.remove('scan-hit'),3000);}
}

// Manual input — ALWAYS WORKS
$('manualMatchBtn').onclick=()=>matchAndHighlight($('manualReg').value);
$('manualReg').onkeydown=e=>e.key==='Enter'&&matchAndHighlight($('manualReg').value);

// OCR Worker — CREATES ONCE, REUSES
async function getWorker(){
 if(!checkTesseract())return null;
 if(worker)return worker;
 
 $('scanStatus').textContent='📥 Loading OCR engine — first time only…';
 try{
  worker=await Tesseract.createWorker('eng',1,{
   cacheMethod:'local', // Saves to device — instant next time
   gzip:false
  });
  await worker.setParameters({
   tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
   tessedit_pageseg_mode:'7' // Single line = FASTEST
  });
  $('scanStatus').textContent='✅ Ready — tap SCAN NOW';
  $('scanStatus').classList.add('ready');
  return worker;
 }catch(e){
  $('scanStatus').textContent='❌ OCR failed — use TYPE below';
  $('scanStatus').classList.add('error');
  return null;
 }
}

function stopCamera(){
 isProcessing=false;
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 $('video').srcObject=null;
 $('scanner').classList.remove('open');
}

$('openScannerBtn').onclick=async()=>{
 if(!checkTesseract())return;
 $('scanner').classList.add('open');
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:360}},audio:false});
  $('video').srcObject=stream;
  getWorker(); // Load in background
 }catch(e){
  alert('⚠️ Camera permission denied.\nUse the TYPE IT box below instead.');
  $('scanner').classList.remove('open');
 }
};
$('closeScanner').onclick=stopCamera;

$('scanNow').onclick=async()=>{
 if(isProcessing)return;
 isProcessing=true;
 
 const wkr=await getWorker();
 if(!wkr){isProcessing=false;return;}
 
 const v=$('video'),c=$('ocrCanvas');
 if(!v.videoWidth){isProcessing=false;return;}
 
 // Crop & shrink = FAST
 const w=v.videoWidth,h=v.videoHeight;
 const sx=Math.round(w*.1), sy=Math.round(h*.4), sw=Math.round(w*.8), sh=Math.round(h*.2);
 c.width=320;c.height=Math.round(320*(sh/sw));
 c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
 
 try{
  const r=await wkr.recognize(c);
  const m=(r.data?.text||'').toUpperCase().match(/[A-Z]{2}\d{2}[A-Z0-9]{3}/);
  if(m)matchAndHighlight(m[0]);
  else $('scanStatus').textContent='No match — try typing below';
 }catch(e){
  $('scanStatus').textContent='OCR error — type below instead';
 }
 isProcessing=false;
};

$('processBtn').onclick=()=>{
 const p=parse($('rawText').value);
 if(!p.length){alert('No registrations found. Format: NX22ULU');return;}
 items=p;save();render();
};
$('clearBtn').onclick=()=>{$('rawText').value='';$('rawText').focus();};
$('search').oninput=filter;
$('resetBtn').onclick=()=>{
 if(confirm('Reset everything?')){localStorage.removeItem(KEY);items=[];$('rawText').value='';$('search').value='';render();}
};

window.addEventListener('beforeunload',async()=>{if(worker)await worker.terminate();if(stream)stopCamera();});
load();
</script>
</body>
</html>
