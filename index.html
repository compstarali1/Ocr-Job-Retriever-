<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fast Reg Checker — OCR & Match</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
:root{--bg:#0a0b0f;--card:#141720;--accent:#4d90fe;--ok:#34d399;--warn:#fbbf24;--text:#e6e8f0;--muted:#888f9e;--border:#2a2f3f}
body{background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
.container{max-width:900px;margin:0 auto}
h1{font-size:22px;margin-bottom:16px;color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:8px;color:#ccc}
textarea{width:100%;height:140px;background:#0f1118;border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text);font-size:15px;line-height:1.5;resize:none;outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(77,144,254,.25)}
.btn{padding:14px 24px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s ease}
.btn-primary{background:var(--accent);color:#fff;width:100%;margin:12px 0}
.btn-primary:hover{background:#3a7de6}
.btn-secondary{background:#252936;color:var(--text)}
.btn-secondary:hover{background:#2d3242}
.upload-box{border:2px dashed var(--border);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:.2s}
.upload-box:hover{border-color:var(--accent);background:rgba(77,144,254,.05)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.progress{height:6px;background:#1f222e;border-radius:3px;overflow:hidden;margin:12px 0;display:none}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:.15s}
.results{margin-top:16px}
.match{padding:10px 14px;border-radius:8px;margin:6px 0;background:rgba(52,211,153,.1);border-left:3px solid var(--ok)}
.nomatch{padding:10px 14px;border-radius:8px;margin:6px 0;background:rgba(251,191,36,.08);border-left:3px solid var(--warn);opacity:.85}
.found-count{font-size:18px;font-weight:700;margin-bottom:10px}
.raw-toggle{margin-top:12px;color:var(--accent);cursor:pointer;font-size:14px}
.raw-text{margin-top:10px;padding:12px;background:#0f1118;border-radius:8px;font-family:monospace;font-size:12px;color:#999;white-space:pre-wrap;max-height:150px;overflow:auto;display:none}
.stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.stat{padding:10px 16px;background:#1a1e2b;border-radius:10px}
.stat b{font-size:20px;display:block}
</style>
<!-- Lightweight OCR — local only, fast -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<div class="container">

<h1>🔍 Fast Reg Checker</h1>

<div class="card">
<label>📋 Your Registration List (paste here — one per line)</label>
<textarea id="regList" placeholder="NX22ULU&#10;NX22ULV&#10;NX72VGN&#10;...">
</textarea>
<div class="hint">Paste your full list — one registration per line. Click "Scan Image" then upload your screenshot/photo.</div>
</div>

<div class="card">
<label>📷 Scan Image for Registrations</label>
<div class="upload-box" id="uploadArea" onclick="document.getElementById('imgInput').click()">
Click to select image<br>
<span class="hint">Screenshot or photo — works instantly</span>
</div>
<input type="file" id="imgInput" accept="image/*" style="display:none">
<button class="btn btn-primary" id="scanBtn" onclick="startScan()">🔍 Scan & Match</button>
<button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="clearAll()">🗑️ Clear Results</button>
<div class="progress" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="stats">
<div class="stat">Total in list <b id="totalList">0</b></div>
<div class="stat">Found in image <b id="foundCount">0</b></div>
<div class="stat">Not found <b id="missingCount">0</b></div>
</div>

<div class="results" id="resultsArea"></div>
<div class="raw-toggle" onclick="toggleRaw()">📄 Toggle Raw OCR Text</div>
<div class="raw-text" id="rawArea"></div>

</div>

<script>
let listRegs = [];
let ocrText = "";

// Update count as user types/pastes
document.getElementById("regList").addEventListener("input", ()=>{
  listRegs = document.getElementById("regList").value.toUpperCase()
    .split("\n")
    .map(r=>r.trim().replace(/\s+/g,''))
    .filter(r=>r.length>3);
  document.getElementById("totalList").textContent = listRegs.length;
});

// Trigger scan when file selected + button clicked
let selectedFile = null;
document.getElementById("imgInput").addEventListener("change",e=>{
  selectedFile = e.target.files[0];
  if(selectedFile){
    document.getElementById("uploadArea").innerHTML = `✅ ${selectedFile.name} — ready to scan`;
  }
});

async function startScan(){
  if(!selectedFile) return alert("Select an image first");
  if(listRegs.length===0) return alert("Paste your registration list first");

  ocrText = "";
  document.getElementById("progressWrap").style.display = "block";
  document.getElementById("progressBar").style.width = "0%";
  document.getElementById("resultsArea").innerHTML = "";
  document.getElementById("rawArea").style.display = "none";

  // Fast OCR — minimal config
  const result = await Tesseract.recognize(selectedFile, "eng", {
    logger:m=>{
      if(m.status==='recognizing text'){
        document.getElementById("progressBar").style.width = Math.round(m.progress*100)+"%";
      }
    },
    tessedit_pageseg_mode:6, // Assume single uniform block — faster
    tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 " // Only what we need
  });

  ocrText = result.data.text.toUpperCase();
  document.getElementById("rawArea").textContent = ocrText;

  // Extract clean regs from OCR — remove spaces for matching
  const foundClean = ocrText.replace(/\s+/g,' ').trim();
  
  // Match — FAST direct check
  let found = [], missing = [];
  listRegs.forEach(reg=>{
    // Check if exact reg appears in OCR text (spaces removed)
    if(ocrText.replace(/\s+/g,'').includes(reg)){
      found.push(reg);
    }else{
      missing.push(reg);
    }
  });

  // Display
  let html = "";
  if(found.length>0){
    html += `<div class="found-count" style="color:var(--ok)">✅ Found: ${found.length}</div>`;
    found.forEach(r=>html += `<div class="match">${r}</div>`);
  }
  if(missing.length>0){
    html += `<div class="found-count" style="color:var(--warn);margin-top:16px;">⚠️ Not Found: ${missing.length}</div>`;
    missing.forEach(r=>html += `<div class="nomatch">${r}</div>`);
  }

  document.getElementById("resultsArea").innerHTML = html;
  document.getElementById("foundCount").textContent = found.length;
  document.getElementById("missingCount").textContent = missing.length;
  document.getElementById("progressWrap").style.display = "none";
  selectedFile = null;
  document.getElementById("uploadArea").innerHTML = "✅ Done — click to select another image";
  document.getElementById("imgInput").value = "";
}

function toggleRaw(){
  const el = document.getElementById("rawArea");
  el.style.display = el.style.display==='block' ? 'none' : 'block';
}

function clearAll(){
  document.getElementById("resultsArea").innerHTML = "";
  document.getElementById("rawArea").style.display = "none";
  document.getElementById("foundCount").textContent = "0";
  document.getElementById("missingCount").textContent = "0";
  selectedFile = null;
  document.getElementById("uploadArea").innerHTML = "Click to select image<br><span class='hint'>Screenshot or photo — works instantly</span>";
  document.getElementById("imgInput").value = "";
}

// Auto-load example list
window.onload = ()=>{
  document.getElementById("regList").value = `NX22ULU
NX22ULV
NX22UMD
NX22UML
NX22UMO
NX22UMR
NX22UMY
NX22UMZ
NX22UNB
NX22UNF
NX22UNK
NX22UNP
NX72VGN
NX72VEP
NX72VFT
NX72VGA
NX72VGC
NX72VGJ
NX72VGL
NX72VGM
NX72VFO
NX72VFV
NX72VGF
NX72VGO
NX72VGR
NX72VGY
NX72VLL
NX72VFL
NX72VFN
NX72VFP
NX72VGD
NX72VGG
NX72VGK
NX72VGP
NX72VGT
NX72VGU
NX72VGV
NX72VLR
NX72VLW
NX72VLY
NX72VME
NX72VKS
NX72VLU
NX72VMG
NX72VLC
NX72VLT
NX72VLO`;
  // Trigger count
  document.getElementById("regList").dispatchEvent(new Event('input'));
};
</script>
</body>
</html>
