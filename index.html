<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Reg Scanner — Flashlight Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
 --bg:#000;--card:#111;--line:#333;
 --text:#fff;--muted:#aaa;--cyan:#0ff;
 --green:#0f8;--amber:#fa0;--scan:#f29;
 --found-top:#0cf;--red:#f44;--purple:#a5f;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Roboto,Arial,sans-serif}
html,body{background:#000;color:var(--text);min-height:100vh;padding:12px;max-width:760px;margin:auto;padding-bottom:180px}
h1{font-size:1.1rem;color:var(--cyan);margin-bottom:4px}
p{font-size:.76rem;color:var(--muted);margin-bottom:16px}
.panel{background:#1a1a1a;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel-title{font-size:.86rem;color:#ddd;margin-bottom:9px;font-weight:700}
textarea{width:100%;height:130px;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:10px;padding:11px;outline:none;font-size:.86rem;resize:none}
textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #0ff4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:10px;padding:12px 8px;color:white;font-weight:700;cursor:pointer;flex:1;min-width:100px;font-size:.85rem;transition:all .2s}
.scanbtn{background:linear-gradient(145deg,#f3a,#906)}
.process{background:linear-gradient(145deg,#0ce,#079)}
.clear{background:linear-gradient(145deg,#555,#333)}
.torch-idle{background:#2a2a2a;border:1px solid #444}
.torch-active{background:linear-gradient(145deg,#ffd700,#ffaa00);color:#000;font-weight:900;box-shadow:0 0 15px #ffd70066}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.stat{background:#1a1a1a;border:1px solid #333;border-radius:10px;text-align:center;padding:10px}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.67rem;color:var(--muted)}
#foundCount{color:var(--found-top)}#pendingCount{color:var(--amber)}#doneCount{color:var(--green)}#totalCount{color:var(--cyan)}
.list-title{font-size:.86rem;padding:8px 4px 6px;border-bottom:1px solid #333;margin:10px 0 5px}
.pending{color:var(--amber)}.done{color:var(--green)}
.found-section{border-bottom:1px dashed #246;margin-bottom:10px;padding-bottom:6px}
.found-title{color:var(--found-top);font-size:.8rem;font-weight:bold;margin:4px 0}
.item{display:flex;align-items:center;gap:10px;background:#1a1a1a;border:1px solid #333;border-left:4px solid var(--amber);border-radius:11px;padding:11px;margin-bottom:7px;transition:.3s ease}
.item.found-top{border-left-color:var(--found-top);background:#0f2533;box-shadow:0 0 14px 3px #0cf3}
.item.done{border-left-color:var(--green);opacity:.7}
.item.just-found{animation:flash .6s ease}
@keyframes flash{0%{transform:scale(1.03);box-shadow:0 0 25px 5px #f29}100%{transform:scale(1)}}
.reg{font-size:1rem;font-weight:900;letter-spacing:.7px}
.tick{width:22px;height:22px;border:2px solid #555;border-radius:6px;cursor:pointer;display:grid;place-items:center;flex:none}
.tick.checked{background:var(--green);border-color:var(--green)}.tick.checked:after{content:"✓";font-weight:900;color:#000}
.notify{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-weight:bold;z-index:9999;opacity:0;transition:opacity .2s ease;pointer-events:none}
.notify.show{opacity:1}
.notify.found{background:#163a2e;border:1px solid var(--green);color:#9efc9e}
.notify.unknown{background:#3a1e1e;border:1px solid var(--red);color:#fbb}
.notify.duplicate{background:#2f1f44;border:1px solid var(--purple);color:#dcf}
.notify.info{background:#1e2b3a;border:1px solid #0af;color:#adf}
#scanner{position:fixed;bottom:0;left:0;right:0;background:#000e;z-index:998;border-top:1px solid #333;padding:12px 15px}
.scanbox{max-width:540px;margin:0 auto}
.video-wrap{position:relative;background:#000;border-radius:13px;overflow:hidden;aspect-ratio:16/11;margin:8px 0}
#video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:7%;right:7%;top:39%;height:22%;border:3px solid var(--scan);border-radius:9px;box-shadow:0 0 0 999px #0006;pointer-events:none}
.scanline{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#f6b;box-shadow:0 0 10px #f29;animation:sl 1.5s linear infinite}
@keyframes sl{0%{top:42%}50%{top:58%}100%{top:42%}}
.scan-status{text-align:center;padding:6px;color:#ddd;font-size:.8rem;line-height:1.4}
.scanner-controls{display:flex;gap:8px;margin-top:8px}
.scanner-controls button{flex:1}
.close{background:#333}
</style>
</head>
<body>

<div id="notify" class="notify"></div>

<h1>🚐 Reg Scanner — 🔦 Flashlight Direct</h1>
<p>Only camera flashlight — no screen light</p>

<div class="panel">
 <div class="panel-title">📋 REGISTRATION LIST</div>
 <textarea id="regBox"></textarea>
 <div class="row">
  <button class="btn process" id="processBtn">⚡ REBUILD</button>
  <button class="btn scanbtn" id="openScanBtn">📷 START SCAN</button>
  <button class="btn clear" id="clearBtn">🗑️ RESET</button>
 </div>
</div>

<div class="stats">
 <div class="stat"><b id="foundCount">0</b><span>FOUND</span></div>
 <div class="stat"><b id="pendingCount">0</b><span>PENDING</span></div>
 <div class="stat"><b id="doneCount">0</b><span>DONE</span></div>
 <div class="stat"><b id="totalCount">0</b><span>TOTAL</span></div>
</div>

<div id="foundSection" class="found-section" style="display:none">
 <div class="found-title">🔵 FOUND — READY</div>
 <div id="foundList"></div>
</div>

<div class="list-title pending">⏳ PENDING</div>
<div id="pendingList"></div>
<div class="list-title done">✅ COMPLETED</div>
<div id="doneList"></div>

<div id="scanner" style="display:none">
 <div class="scanbox">
  <div class="video-wrap">
   <video id="video" autoplay muted playsinline></video>
   <div class="frame"><div class="scanline"></div></div>
  </div>
  <div class="scan-status" id="scanStatus">🔴 Starting…</div>
  <div class="scanner-controls">
   <button class="btn torch-idle" id="torchBtn">🔦 FLASHLIGHT</button>
   <button class="btn close" id="closeScan">✕ STOP</button>
  </div>
 </div>
</div>
<canvas id="canvas" style="display:none"></canvas>

<script>
const $=id=>document.getElementById(id);
const SAVE_KEY = 'regScanner_savedData';
const regBox=$('regBox'), notify=$('notify');
let items=[], stream=null, scanLoopActive=false, lastHit=0;
let torchOn=false;

const PRESET_LIST = `NX22ULU
NX22ULV
NX22UMD
NX22UML
NX22UMO
NX22UMR
NX22UMY
NX22UMZ
NX22UNB
NX22UNF
NX22UNK
NX22UNP
NX72VGN
NX72VEP
NX72VFT
NX72VGA
NX72VGC
NX72VGJ
NX72VGL
NX72VGM
NX72VFO
NX72VFV
NX72VGF
NX72VGO
NX72VGR
NX72VGY
NX72VLL
NX72VFL
NX72VFN
NX72VFP
NX72VGD
NX72VGG
NX72VGK
NX72VGP
NX72VGT
NX72VGU
NX72VGV
NX72VLR
NX72VLW
NX72VLY
NX72VME
NX72VKS
NX72VLU
NX72VMG
NX72VLC
NX72VLT
NX72VLO`;

function clean(s){return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}

function soundFound(){try{const c=new (window.AudioContext||webkitAudioContext);const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){}}
function soundUnknown(){try{const c=new (window.AudioContext||webkitAudioContext);const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220,c.currentTime);o.frequency.exponentialRampToValueAtTime(110,c.currentTime+.2);g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){}}
function soundDuplicate(){try{const c=new (window.AudioContext||webkitAudioContext);const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+.1);g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){}}

function showNotify(msg, type='info'){notify.className='notify show '+type;notify.textContent=msg;setTimeout(()=>notify.classList.remove('show'),1500)}

// ─── DIRECT FLASHLIGHT CONTROL ───
async function setTorchState(on){
 if(!stream) return false;
 const track = stream.getVideoTracks().find(t => t.readyState === 'live');
 if(!track) return false;
 if(!track.applyConstraints) return false;

 try{
  // Method 1: Direct torch
  await track.applyConstraints({advanced: [{ torch: on }]});
  return true;
 }catch(e1){
  try{
   // Method 2: fillLightMode
   await track.applyConstraints({advanced: [{ fillLightMode: on ? 'flash' : 'off' }]});
   return true;
  }catch(e2){
   try{
    // Method 3: All advanced keys
    await track.applyConstraints({advanced: [{ torch: on, fillLightMode: on ? 'flash' : 'off' }]});
    return true;
   }catch(e3){
    return false;
   }
  }
 }
}

async function toggleTorch(){
 if(!stream) return showNotify('❌ Start scanner first','unknown');
 
 torchOn = !torchOn;
 const ok = await setTorchState(torchOn);
 const btn = $('torchBtn');

 if(ok){
  if(torchOn){
   btn.classList.add('torch-active'); btn.classList.remove('torch-idle');
   btn.textContent='🔦 ON';
   showNotify('✅ FLASHLIGHT ON','found');
  }else{
   btn.classList.remove('torch-active'); btn.classList.add('torch-idle');
   btn.textContent='🔦 FLASHLIGHT';
  }
 }else{
  torchOn = !torchOn; // revert
  showNotify('❌ FLASHLIGHT NOT SUPPORTED ON THIS DEVICE/BROWSER','unknown');
  $('scanStatus').innerHTML='❌ Your browser/phone does not allow flashlight control.<br>Use Chrome on Android for full control.';
 }
}

// ─── DATA & SAVE ───
function buildList(text){return text.split('\n').map(r=>clean(r)).filter(r=>r.length>4).map(reg=>({reg,done:false,found:false}))}
function saveData(){localStorage.setItem(SAVE_KEY,JSON.stringify({listText:regBox.value,items:items}))}
function loadData(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d?.items?.length){regBox.value=d.listText;items=d.items;return true;}}catch(e){}return false}
function resetAll(){if(confirm('⚠️ Reset ALL progress?')){localStorage.removeItem(SAVE_KEY);regBox.value=PRESET_LIST;items=buildList(PRESET_LIST);render()}}

function render(){
 const foundItems=items.filter(i=>i.found && !i.done), pendingItems=items.filter(i=>!i.found && !i.done), doneItems=items.filter(i=>i.done);
 $('foundSection').style.display=foundItems.length?'block':'none';
 $('foundList').innerHTML=''; $('pendingList').innerHTML=''; $('doneList').innerHTML='';
 foundItems.forEach(item=>{const el=document.createElement('div');el.className='item found-top'+(item.justFound?' just-found':'');el.innerHTML=`<div class="tick" onclick="markDone(${items.indexOf(item)})"></div><div class="reg">${item.reg}</div>`;$('foundList').appendChild(el);if(item.justFound)setTimeout(()=>{item.justFound=false;saveData();render()},600)});
 pendingItems.forEach(item=>{const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="tick" onclick="markDone(${items.indexOf(item)})"></div><div class="reg">${item.reg}</div>`;$('pendingList').appendChild(el)});
 doneItems.forEach(item=>{const el=document.createElement('div');el.className='item done';el.innerHTML=`<div class="tick checked" onclick="unmark(${items.indexOf(item)})"></div><div class="reg">${item.reg}</div>`;$('doneList').appendChild(el)});
 $('foundCount').textContent=foundItems.length;$('pendingCount').textContent=pendingItems.length;$('doneCount').textContent=doneItems.length;$('totalCount').textContent=items.length;
}
function markDone(idx){items[idx].done=true;items[idx].found=false;saveData();render()}
function unmark(idx){items[idx].done=false;saveData();render()}

// ─── START SCAN ───
$('openScanBtn').onclick=async()=>{
 if(!items.length)return alert('Build list first');
 
 $('scanner').style.display='block';
 $('scanStatus').textContent='🔐 Requesting camera… Allow when prompted';
 
 try{
  stream = await navigator.mediaDevices.getUserMedia({
   video: {
    facingMode: 'environment',
    width: { ideal: 1280 },
    height: { ideal: 720 }
   },
   audio: false
  });
  
  $('video').srcObject = stream;
  $('scanStatus').innerHTML='✅ Camera ready<br>🔦 Tap FLASHLIGHT button to turn light ON';
  scanLoopActive = true;
  torchOn = false;
  continuousScan();
  
 }catch(err){
  $('scanStatus').innerHTML='❌ Camera blocked — Allow camera in Settings';
  showNotify('❌ Camera permission denied','unknown');
 }
};

// ─── STOP SCAN ───
$('closeScan').onclick=async()=>{
 if(torchOn && stream){
  const track = stream.getVideoTracks()[0];
  if(track?.applyConstraints) try{ await track.applyConstraints({advanced:[{torch:false}]}) }catch(e){}
 }
 scanLoopActive = false;
 if(stream) stream.getTracks().forEach(t => t.stop());
 stream = null; torchOn = false;
 $('video').srcObject = null;
 $('scanner').style.display = 'none';
 $('torchBtn').classList.remove('torch-active'); $('torchBtn').classList.add('torch-idle');
 $('torchBtn').textContent='🔦 FLASHLIGHT';
};

$('torchBtn').onclick = toggleTorch;

// ─── INIT ───
window.onload=()=>{if(!loadData()){regBox.value=PRESET_LIST;items=buildList(PRESET_LIST)}render()};
$('processBtn').onclick=()=>{items=buildList(regBox.value);if(!items.length)return alert('No regs found');saveData();render()};
$('clearBtn').onclick=resetAll;

// ─── SCAN LOOP ───
async function continuousScan(){
 if(!scanLoopActive)return;
 const v=$('video'),c=$('canvas');
 if(v.videoWidth){
  const w=v.videoWidth,h=v.videoHeight;
  const sx=Math.round(w*.07),sy=Math.round(h*.39),sw=Math.round(w*.86),sh=Math.round(h*.22);
  c.width=sw;c.height=sh;
  c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,sw,sh);
  try{
   const r=await Tesseract.recognize(c,'eng',{logger:()=>{},tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',tessedit_pageseg_mode:6});
   const found=clean(r.data.text);
   const match=items.find(i=>found.includes(i.reg));
   if(match){
    if(!match.found && !match.done && Date.now()-lastHit>2500){
      lastHit=Date.now();match.found=true;match.justFound=true;
      soundFound();showNotify('✅ FOUND: '+match.reg,'found');
      $('scanStatus').textContent='✅ FOUND: '+match.reg;
      saveData();render();
      setTimeout(()=>$('foundSection').scrollIntoView({behavior:'smooth',block:'start'}),100);
    }else if((match.found||match.done)&&Date.now()-lastHit>2500){
      lastHit=Date.now();soundDuplicate();showNotify('🔄 DUPLICATE: '+match.reg,'duplicate');
      $('scanStatus').textContent='🔄 Already processed';
    }
   }else if(found.length>=5 && Date.now()-lastHit>2500){
    lastHit=Date.now();soundUnknown();showNotify('❌ UNKNOWN REG','unknown');
    $('scanStatus').textContent='❌ Not in list';
   }
  }catch(e){}
 }
 setTimeout(continuousScan, v.videoWidth?800:300);
}
</script>
</body>
</html>
