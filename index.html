<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reg Scanner & Matcher</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:#111;color:#fff;padding:20px;max-width:800px;margin:0 auto}
h1{font-size:20px;margin-bottom:15px}
.box{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:15px;margin-bottom:15px}
label{display:block;margin:10px 0 5px;font-weight:bold}
textarea{width:100%;height:180px;background:#222;border:1px solid #444;color:#fff;padding:10px;border-radius:5px;font-size:14px;resize:none}
.btn{background:#2563eb;color:#fff;border:none;padding:12px 20px;border-radius:5px;font-size:16px;cursor:pointer;margin:5px 0;width:100%}
.btn:hover{background:#1d4ed8}
.upload-area{border:2px dashed #555;border-radius:8px;padding:30px;text-align:center;cursor:pointer;margin:10px 0}
.upload-area:hover{border-color:#2563eb;background:#1e293b}
.progress{height:8px;background:#333;border-radius:4px;margin:10px 0;display:none}
.progress>div{height:100%;background:#2563eb;width:0%;border-radius:4px;transition:width 0.2s}
.found{background:#163328;border-left:4px solid #22c55e;padding:10px;margin:5px 0;border-radius:0 5px 5px 0}
.missing{background:#332a17;border-left:4px solid #f59e0b;padding:10px;margin:5px 0;border-radius:0 5px 5px 0}
.counts{display:flex;gap:20px;margin:10px 0}
.count{padding:10px 15px;background:#222;border-radius:5px}
.raw-btn{background:#333;color:#ddd;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;margin-top:10px}
.raw-text{margin-top:10px;padding:10px;background:#222;border-radius:5px;font-family:monospace;font-size:12px;color:#aaa;white-space:pre-wrap;max-height:150px;overflow:auto;display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<h1>📋 Registration Scanner & Matcher</h1>

<!-- YOUR LIST PASTE BOX -->
<div class="box">
<label>1. Paste your registration list here (one per line)</label>
<textarea id="regList" placeholder="NX22ULU&#10;NX22ULV&#10;NX72VGN&#10;..."></textarea>
</div>

<!-- SCAN AREA -->
<div class="box">
<label>2. Select & scan image</label>
<div class="upload-area" id="dropArea" onclick="document.getElementById('imgFile').click()">
📷 Click to select image<br>
<span style="color:#888;font-size:12px">Screenshot or photo of your job list</span>
</div>
<input type="file" id="imgFile" accept="image/*" style="display:none">
<button class="btn" id="scanButton" onclick="doScan()">🔍 SCAN & MATCH</button>
<div class="progress" id="progWrap"><div id="progBar"></div></div>
</div>

<!-- RESULTS -->
<div class="counts">
<div class="count">Total in list: <strong id="total">0</strong></div>
<div class="count" style="color:#22c55e">Found: <strong id="found">0</strong></div>
<div class="count" style="color:#f59e0b">Not found: <strong id="missing">0</strong></div>
</div>

<div id="results"></div>
<button class="raw-btn" onclick="toggleRaw()">Show/Hide scanned text</button>
<div class="raw-text" id="rawOcr"></div>

<script>
let selectedImage = null;
let ocrResultText = "";

// Count registrations as you type/paste
document.getElementById('regList').addEventListener('input', updateCount);
function updateCount(){
  const regs = getCleanList();
  document.getElementById('total').textContent = regs.length;
}
function getCleanList(){
  return document.getElementById('regList').value
    .toUpperCase()
    .split('\n')
    .map(r => r.trim().replace(/\s+/g, ''))
    .filter(r => r.length > 3);
}

// Image selected
document.getElementById('imgFile').addEventListener('change', e => {
  selectedImage = e.target.files[0];
  if(selectedImage){
    document.getElementById('dropArea').innerHTML = `✅ Image loaded: ${selectedImage.name}`;
  }
});

// DO THE SCAN & MATCH
async function doScan(){
  if(!selectedImage) return alert('Select an image first');
  const regs = getCleanList();
  if(regs.length === 0) return alert('Paste your registration list first');

  // Reset
  document.getElementById('results').innerHTML = '';
  document.getElementById('progWrap').style.display = 'block';
  document.getElementById('progBar').style.width = '0%';
  document.getElementById('rawOcr').style.display = 'none';

  // OCR — fast mode
  const result = await Tesseract.recognize(selectedImage, 'eng', {
    logger: m => {
      if(m.status === 'recognizing text'){
        document.getElementById('progBar').style.width = Math.round(m.progress * 100) + '%';
      }
    },
    tessedit_pageseg_mode: 6,
    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 '
  });

  ocrResultText = result.data.text.toUpperCase();
  document.getElementById('rawOcr').textContent = ocrResultText;

  // Match — remove spaces for clean comparison
  const cleanOcr = ocrResultText.replace(/\s+/g, '');
  const foundList = [], missingList = [];
  regs.forEach(reg => {
    if(cleanOcr.includes(reg)) foundList.push(reg);
    else missingList.push(reg);
  });

  // Show results
  let html = '';
  if(foundList.length){
    html += '<h3 style="color:#22c55e;margin:15px 0 5px">✅ FOUND</h3>';
    foundList.forEach(r => html += `<div class="found">${r}</div>`);
  }
  if(missingList.length){
    html += '<h3 style="color:#f59e0b;margin:15px 0 5px">⚠️ NOT FOUND</h3>';
    missingList.forEach(r => html += `<div class="missing">${r}</div>`);
  }

  document.getElementById('results').innerHTML = html;
  document.getElementById('found').textContent = foundList.length;
  document.getElementById('missing').textContent = missingList.length;
  document.getElementById('progWrap').style.display = 'none';
}

function toggleRaw(){
  const el = document.getElementById('rawOcr');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
</script>

</body>
</html>
