<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hyde Park Corner — Job Planner</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#000;--card:#111;--line:#333;--text:#fff;--muted:#aaa;--cyan:#0ff;--green:#0f8;--amber:#fa0;--scan:#f29;--found-top:#0cf;--red:#f44;--purple:#a5f;--theme-icon:#888}
[data-theme="light"]{--bg:#f5f5f5;--card:#fff;--line:#ddd;--text:#111;--muted:#666;--cyan:#08f;--green:#0a6;--amber:#c80;--scan:#e25;--found-top:#08c;--red:#c33;--purple:#84f;--theme-icon:#555}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Roboto,Arial,sans-serif}
html,body{background:var(--bg);color:var(--text);min-height:100vh;padding:12px;max-width:760px;margin:auto;padding-bottom:180px;transition:background .3s,color .3s}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1.title-main{font-size:1.5rem;font-weight:900;letter-spacing:1px;color:var(--cyan);margin:0;white-space:nowrap}
.theme-toggle{background:transparent;border:none;font-size:1.3rem;cursor:pointer;padding:4px 8px;color:var(--theme-icon);transition:transform .2s}
.theme-toggle:hover{transform:scale(1.15)}
p{font-size:.76rem;color:var(--muted);margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
textarea{width:100%;height:130px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;outline:none;font-size:.86rem;resize:none}
.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 4px;color:white;font-weight:700;cursor:pointer;flex:1;min-width:70px;font-size:.75rem;transition:all .2s;white-space:nowrap}
.scanbtn{background:linear-gradient(145deg,#f3a,#906)}
.process{background:linear-gradient(145deg,#0ce,#079)}
.clear{background:linear-gradient(145deg,#555,#333)}
.exportbtn{background:linear-gradient(145deg,#4a6,#284)}
.savebtn{background:linear-gradient(145deg,#26a,#148)}
.restorebtn{background:linear-gradient(145deg,#862,#641)}
.torch-idle{background:#ffcc00;color:#000;font-weight:bold}
.torch-active{background:#ffd700;color:#000;font-weight:bold;box-shadow:0 0 20px #ffd700}
.torch-disabled{background:#555;color:#999;cursor:not-allowed}
/* Floating Scan Button */
.floating-scan{position:fixed;bottom:24px;right:20px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#f44,#c00);border:none;color:#fff;font-size:1.4rem;cursor:pointer;z-index:997;box-shadow:0 4px 14px #f445,inset 0 -3px 8px #0003;display:grid;place-items:center;transition:transform .2s,box-shadow .2s}
.floating-scan:hover{transform:scale(1.08);box-shadow:0 6px 20px #f448}
.floating-scan:active{transform:scale(.95)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;padding:10px}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.67rem;color:var(--muted)}
#foundCount{color:var(--found-top)}#pendingCount{color:var(--amber)}#doneCount{color:var(--green)}#totalCount{color:var(--cyan)}
.list-title{font-size:.86rem;padding:10px 6px 6px;border-bottom:1px solid var(--line);margin:14px 0 6px;font-weight:bold}
.title-found{color:var(--found-top);background:var(--bg);padding:4px 8px;border-radius:6px}
.title-pending{color:var(--amber)}
.title-done{color:var(--green)}
.item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:11px;padding:10px;margin-bottom:7px;flex-wrap:wrap}
.item.found-top{border-left-color:var(--found-top);background:rgba(0,204,255,.08);box-shadow:0 0 14px 3px rgba(0,204,255,.15)}
.item.done{border-left-color:var(--green);opacity:.7}
.reg{font-size:1rem;font-weight:900;letter-spacing:.7px;min-width:110px}
.section-tag{font-size:.65rem;padding:2px 6px;border-radius:4px;font-weight:bold;text-transform:uppercase;white-space:nowrap}
.sec-found{background:rgba(0,204,255,.15);color:var(--found-top)}
.sec-pending{background:rgba(255,170,0,.15);color:var(--amber)}
.sec-done{background:rgba(0,255,102,.15);color:var(--green)}
.custom-num{width:65px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 6px;text-align:center;font-size:.85rem;font-weight:bold;outline:none}
.tick{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;cursor:pointer;display:grid;place-items:center;flex:none}
.tick.checked{background:var(--green);border-color:var(--green)}.tick.checked:after{content:"✓";font-weight:900;color:#000}
.notify{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-weight:bold;z-index:9999;opacity:0;transition:opacity .2s ease;pointer-events:none}
.notify.show{opacity:1}
.notify.found{background:#163a2e;border:1px solid var(--green);color:#9efc9e}
.notify.unknown{background:#3a1e1e;border:1px solid var(--red);color:#fbb}
.notify.duplicate{background:#2f1f44;border:1px solid var(--purple);color:#dcf}
.notify.info{background:#1e2b3a;border:1px solid #0af;color:#adf}
.export-modal,.restore-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:10000;opacity:0;visibility:hidden;transition:.2s}
.export-modal.show,.restore-modal.show{opacity:1;visibility:visible}
.export-box,.restore-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px;max-width:340px;width:100%}
.export-box h3,.restore-box h3{margin:0 0 14px 0;color:var(--cyan);font-size:1rem}
.export-option,.restore-option{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:.9rem}
.export-option:hover,.restore-option:hover{border-color:var(--cyan)}
.export-close,.restore-close{margin-top:10px;background:#444;text-align:center}
.file-input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;margin-bottom:10px}
#scanner{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);z-index:998;border-top:1px solid var(--line);padding:12px 15px}
.scanbox{max-width:540px;margin:0 auto}
.video-wrap{position:relative;background:#000;border-radius:13px;overflow:hidden;aspect-ratio:16/11;margin:8px 0}
#video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:7%;right:7%;top:39%;height:22%;border:3px solid var(--scan);border-radius:9px;box-shadow:0 0 0 999px rgba(0,0,0,.6);pointer-events:none}
.scanline{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#f6b;box-shadow:0 0 10px #f29;animation:sl 1.5s linear infinite}
@keyframes sl{0%{top:42%}50%{top:58%}100%{top:42%}}
.scan-status{text-align:center;padding:6px;color:#ddd;font-size:.8rem;line-height:1.4}
.scanner-controls{display:flex;gap:8px;margin-top:8px}
.scanner-controls button{flex:1}
.close{background:#333}
</style>
</head>
<body>

<div id="notify" class="notify"></div>

<!-- Header with Title + Theme Toggle -->
<div class="header-row">
  <h1 class="title-main">Hyde Park Corner Job Planner</h1>
  <button class="theme-toggle" id="themeBtn" title="Toggle Dark/Light Theme">🌙</button>
</div>
<p>✅ Save • Restore • Export • Scan • Samsung flashlight</p>

<div class="panel">
 <textarea id="regBox"></textarea>
 <div class="row">
  <button class="btn process" id="processBtn">⚡ REBUILD</button>
  <button class="btn scanbtn" id="openScanBtn">📷 SCAN</button>
  <button class="btn clear" id="clearBtn">🗑️ RESET</button>
  <button class="btn exportbtn" id="exportBtn">📤 EXPORT</button>
  <button class="btn savebtn" id="saveLayoutBtn">💾 SAVE</button>
  <button class="btn restorebtn" id="restoreLayoutBtn">📂 RESTORE</button>
 </div>
</div>

<div class="stats">
 <div class="stat"><b id="foundCount">0</b><span>FOUND</span></div>
 <div class="stat"><b id="pendingCount">0</b><span>PENDING</span></div>
 <div class="stat"><b id="doneCount">0</b><span>DONE</span></div>
 <div class="stat"><b id="totalCount">0</b><span>TOTAL</span></div>
</div>

<div id="foundSection" style="display:none">
 <div class="list-title title-found">🔵 FOUND — READY</div>
 <div id="foundList"></div>
</div>

<div class="list-title title-pending">⏳ PENDING</div>
<div id="pendingList"></div>

<div class="list-title title-done">✅ COMPLETED</div>
<div id="doneList"></div>

<!-- Floating Red Scan Button — Bottom Right -->
<button class="floating-scan" id="floatingScanBtn" title="Start Scanning">📷</button>

<div id="scanner" style="display:none">
 <div class="scanbox">
  <div class="video-wrap"><video id="video" autoplay muted playsinline></video><div class="frame"><div class="scanline"></div></div></div>
  <div class="scan-status" id="scanStatus">🔴 Starting…</div>
  <div class="scanner-controls">
   <button class="btn torch-idle" id="torchBtn" disabled>🔦 Loading…</button>
   <button class="btn close" id="closeScan">✕ STOP</button>
  </div>
 </div>
</div>

<!-- Export Modal -->
<div id="exportModal" class="export-modal">
 <div class="export-box">
  <h3>📤 EXPORT OPTION</h3>
  <button class="export-option" data-type="all">📋 1. Complete JOB List</button>
  <button class="export-option" data-type="completed">✅ 2. Completed JOBS</button>
  <button class="export-option" data-type="remaining">⏳ 3. Remaining JOBS</button>
  <button class="export-option export-close" id="exportClose">✕ CANCEL</button>
 </div>
</div>

<!-- Restore Modal -->
<div id="restoreModal" class="restore-modal">
 <div class="restore-box">
  <h3>📂 RESTORE LAYOUT</h3>
  <input type="file" id="restoreFileInput" accept=".json,.txt" class="file-input">
  <button class="restore-option" id="doRestoreBtn">✅ RESTORE FROM FILE</button>
  <button class="restore-option restore-close" id="restoreClose">✕ CANCEL</button>
 </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const $=id=>document.getElementById(id);
const SAVE_KEY='regScanner_savedData';
const THEME_KEY='hpc_theme';
let items=[],stream=null,track=null,torchOn=false,supportMode=null,lastHit=0;

const PRESET_LIST=`NX22ULU
NX22ULV
NX22UMD
NX22UML
NX22UMO
NX22UMR
NX22UMY
NX22UMZ
NX22UNB
NX22UNF
NX22UNK
NX22UNP
NX72VGN
NX72VEP
NX72VFT
NX72VGA
NX72VGC
NX72VGJ
NX72VGL
NX72VGM
NX72VFO
NX72VFV
NX72VGF
NX72VGO
NX72VGR
NX72VGY
NX72VLL
NX72VFL
NX72VFN
NX72VFP
NX72VGD
NX72VGG
NX72VGK
NX72VGP
NX72VGT
NX72VGU
NX72VGV
NX72VLR
NX72VLW
NX72VLY
NX72VME
NX72VKS
NX72VLU
NX72VMG
NX72VLC
NX72VLT
NX72VLO`;

// Theme Toggle
function setTheme(mode){
  document.documentElement.setAttribute('data-theme',mode);
  $('themeBtn').textContent=mode==='light'?'☀️':'🌙';
  localStorage.setItem(THEME_KEY,mode);
}
function toggleTheme(){
  const current=document.documentElement.getAttribute('data-theme');
  setTheme(current==='light'?'dark':'light');
}
function initTheme(){
  const saved=localStorage.getItem(THEME_KEY);
  if(saved)setTheme(saved);
}

function clean(s){return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function looksLikePlate(s){return s.length>=6 && s.length<=8 && /[A-Z]/.test(s) && /[0-9]/.test(s)}
function showNotify(msg,type='info'){$('notify').className='notify show '+type;$('notify').textContent=msg;setTimeout(()=>$('notify').classList.remove('show'),2000)}

// Sounds
function soundFound(){try{const c=new (window.AudioContext||webkitAudioContext);const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){}}
function soundUnknown(){try{const c=new (window.AudioContext||webkitAudioContext);const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220,c.currentTime);o.frequency.exponentialRampToValueAtTime(110,c.currentTime+.2);g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){}}
function soundDuplicate(){try{const c=new (window.AudioContext||webkitAudioContext);const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+.1);g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){}}

// Samsung Flashlight
async function checkFlashSupport(){
 if(!track)return null;
 const cap=track.getCapabilities();
 if('torch' in cap)return supportMode='torch','torch';
 if(cap.fillLightMode?.includes('continuous'))return supportMode='continuous','continuous';
 if(cap.fillLightMode?.includes('flash'))return supportMode='flash','flash';
 return null;
}
async function setTorchLED(on){
 if(!track||!supportMode)return false;
 try{
  if(supportMode==='torch'){await track.applyConstraints({advanced:[{torch:on}]});return true}
  if(supportMode==='continuous'){await track.applyConstraints({advanced:[{fillLightMode:on?'continuous':'off'}]});return true}
  if(supportMode==='flash'){await track.applyConstraints({advanced:[{fillLightMode:on?'flash':'off'}]});return true}
 }catch(e){}
 return false;
}
async function toggleFlash(){
  if(!track)return showNotify('❌ Start scanner first','unknown');
  torchOn=!torchOn;
  const ok=await setTorchLED(torchOn),b=$('torchBtn');
  if(ok){
    if(torchOn){
      b.className='btn torch-active';
      b.textContent='🔦 LED ON';
      showNotify('✅ FLASHLIGHT ON','found');
    }else{
      b.className='btn torch-idle';
      b.textContent='🔦 TURN LED ON';
      showNotify('🔦 FLASHLIGHT OFF','info');
    }
  }else{
    torchOn=!torchOn;
    b.className='btn torch-disabled';
    b.textContent='🔦 USE PHONE TORCH';
    showNotify('⚠️ Browser cannot control LED — use phone torch manually','unknown');
  }
}

// Data
function buildList(t){
  return t.split('\n').map(r=>clean(r)).filter(r=>r.length>4).map(r=>({reg:r,done:false,found:false,customNum:''}));
}
function saveData(){localStorage.setItem(SAVE_KEY,JSON.stringify({listText:$('regBox').value,items}))}
function loadData(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d?.items?.length){items=d.items;$('regBox').value=d.listText;return true}}catch(e){}return false}
function updateCustomNum(index,value){items[index].customNum=value.replace(/[^0-9]/g,'').slice(0,4);saveData()}

// Save/Restore
function getTodayDate(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}${String(d.getMonth()+1).padStart(2,'0')}${d.getFullYear()}`}
function saveLayoutToFile(){
  const layoutData={version:"1.0",savedAt:new Date().toISOString(),listText:$('regBox').value,items:items.map(i=>({reg:i.reg,done:i.done,found:i.found,customNum:i.customNum}))};
  const fileName=`HPC-LAYOUT-SAVED-(${getTodayDate()}).json`;
  const blob=new Blob([JSON.stringify(layoutData,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=fileName;a.click();URL.revokeObjectURL(url);
  showNotify('✅ Layout saved: '+fileName,'found');
}
async function restoreLayoutFromFile(file){
  try{
    const text=await file.text();const data=JSON.parse(text);
    if(!data.items||!Array.isArray(data.items))throw new Error('Invalid file format');
    items=data.items;$('regBox').value=data.listText||'';saveData();render();
    showNotify('✅ Layout restored — '+items.length+' records loaded','found');
    $('restoreModal').classList.remove('show');
  }catch(err){showNotify('❌ Restore failed: '+err.message,'unknown')}
}

// Export
function generateExportText(filterType){
  let filteredItems=[],headerLabel='';
  if(filterType==='all'){filteredItems=[...items];headerLabel='COMPLETE JOB LIST'}
  else if(filterType==='completed'){filteredItems=items.filter(i=>i.done);headerLabel='COMPLETED JOBS'}
  else if(filterType==='remaining'){filteredItems=items.filter(i=>!i.done);headerLabel='REMAINING JOBS'}
  let text=`${headerLabel}\nDate: ${new Date().toLocaleDateString()}\nTotal: ${filteredItems.length}\n${'━'.repeat(30)}\n\n`;
  filteredItems.forEach((item,idx)=>{
    const status=item.done?'[DONE]':(item.found?'[FOUND]':'[PENDING]');
    text+=`${String(idx+1).padStart(3,'0')}  ${item.reg}  Ref: ${item.customNum||'----'}  ${status}\n`;
  });
  return text;
}
function getFileName(filterType){
  const date=getTodayDate();
  if(filterType==='all')return `HPC-JOBS-LIST-(${date}).txt`;
  if(filterType==='completed')return `HPC-COMPLETED-JOBS-(${date}).txt`;
  return `HPC-PENDING-JOBS-(${date}).txt`;
}
function downloadFile(filterType){
  const text=generateExportText(filterType),name=getFileName(filterType);
  const blob=new Blob([text],{type:'text/plain'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
  showNotify('✅ Exported: '+name,'found');$('exportModal').classList.remove('show');
}

// Render
function render(){
  const f=items.filter(i=>i.found&&!i.done),p=items.filter(i=>!i.found&&!i.done),d=items.filter(i=>i.done);
  $('foundSection').style.display=f.length?'block':'none';
  $('foundList').innerHTML=f.map(item=>{const idx=items.indexOf(item);return `<div class="item found-top"><div class="tick" onclick="markDone(${idx})"></div><span class="reg">${item.reg}</span><span class="section-tag sec-found">FOUND</span><input type="text" class="custom-num" placeholder="0000" value="${item.customNum}" maxlength="4" inputmode="numeric" oninput="updateCustomNum(${idx}, this.value)"></div>`}).join('');
  $('pendingList').innerHTML=p.map(item=>{const idx=items.indexOf(item);return `<div class="item"><div class="tick" onclick="markDone(${idx})"></div><span class="reg">${item.reg}</span><span class="section-tag sec-pending">PENDING</span><input type="text" class="custom-num" placeholder="0000" value="${item.customNum}" maxlength="4" inputmode="numeric" oninput="updateCustomNum(${idx}, this.value)"></div>`}).join('');
  $('doneList').innerHTML=d.map(item=>{const idx=items.indexOf(item);return `<div class="item done"><div class="tick checked" onclick="unmark(${idx})"></div><span class="reg">${item.reg}</span><span class="section-tag sec-done">DONE</span><input type="text" class="custom-num" placeholder="0000" value="${item.customNum}" maxlength="4" inputmode="numeric" oninput="updateCustomNum(${idx}, this.value)"></div>`}).join('');
  $('foundCount').textContent=f.length;$('pendingCount').textContent=p.length;$('doneCount').textContent=d.length;$('totalCount').textContent=items.length;
}
function markDone(i){items[i].done=true;items[i].found=false;saveData();render()}
function unmark(i){items[i].done=false;saveData();render()}

// Scanner — shared function for both buttons
async function startScanner(){
  if(!items.length)return alert('Build list first');
  $('scanner').style.display='block';
  $('scanStatus').textContent='🔐 Requesting camera…';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    $('video').srcObject=stream;track=stream.getVideoTracks()[0];
    const mode=await checkFlashSupport();const btn=$('torchBtn');
    if(mode){btn.disabled=false;btn.className='btn torch-idle';btn.textContent='🔦 TURN LED ON';$('scanStatus').innerHTML=`✅ Ready — Flashlight: <b>${mode}</b>`;}
    else{btn.disabled=true;btn.className='btn torch-disabled';btn.textContent='🔦 USE PHONE TORCH';$('scanStatus').innerHTML='⚠️ Browser LED control unavailable.<br>👉 Use phone torch from top panel.';}
    scanLoop();
  }catch(e){$('scanStatus').textContent='❌ Camera denied — Allow in Settings'}
}

$('openScanBtn').onclick=startScanner;
$('floatingScanBtn').onclick=startScanner;

$('closeScan').onclick=async()=>{
  if(torchOn&&track)await setTorchLED(false);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;track=null;torchOn=false;supportMode=null;
  $('scanner').style.display='none';
  $('torchBtn').disabled=true;$('torchBtn').className='btn torch-idle';$('torchBtn').textContent='🔦 Loading…';
};

async function scanLoop(){
  if(!stream)return;
  const v=$('video'),c=$('canvas');
  if(v.videoWidth){
    c.width=Math.round(v.videoWidth*.86);c.height=Math.round(v.videoHeight*.22);
    c.getContext('2d').drawImage(v,Math.round(v.videoWidth*.07),Math.round(v.videoHeight*.39),c.width,c.height,0,0,c.width,c.height);
    try{
      const r=await Tesseract.recognize(c,'eng',{logger:()=>{},tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',tessedit_pageseg_mode:6});
      const found=clean(r.data.text);
      if(!looksLikePlate(found)){setTimeout(scanLoop,800);return}
      const match=items.find(i=>found.includes(i.reg));
      if(match){
        if(!match.found&&!match.done&&Date.now()-lastHit>2500){
          lastHit=Date.now();match.found=true;soundFound();showNotify('✅ FOUND: '+match.reg,'found');saveData();render();
        }else if((match.found||match.done)&&Date.now()-lastHit>2500){
          lastHit=Date.now();soundDuplicate();showNotify('🔄 DUPLICATE: '+match.reg,'duplicate');
        }
      }else{
        if(Date.now()-lastHit>2500){lastHit=Date.now();soundUnknown();showNotify('❌ UNKNOWN REG: '+found,'unknown')}
      }
    }catch(e){}
  }
  setTimeout(scanLoop,800);
}

// Wiring
$('themeBtn').onclick=toggleTheme;
$('torchBtn').onclick=toggleFlash;
$('exportBtn').onclick=()=>$('exportModal').classList.add('show');
$('exportClose').onclick=()=>$('exportModal').classList.remove('show');
document.querySelectorAll('.export-option[data-type]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.type));
$('saveLayoutBtn').onclick=saveLayoutToFile;
$('restoreLayoutBtn').onclick=()=>$('restoreModal').classList.add('show');
$('restoreClose').onclick=()=>$('restoreModal').classList.remove('show');
$('doRestoreBtn').onclick=()=>{const file=$('restoreFileInput').files[0];if(!file)return showNotify('⚠️ Select a file first','unknown');restoreLayoutFromFile(file)};

window.onload=()=>{
  initTheme();
  if(!loadData()){$('regBox').value=PRESET_LIST;items=buildList(PRESET_LIST)}
  render();
};
$('processBtn').onclick=()=>{items=buildList($('regBox').value);saveData();render()};
$('clearBtn').onclick=()=>{if(confirm('Reset ALL progress? This cannot be undone.')){localStorage.removeItem(SAVE_KEY);$('regBox').value=PRESET_LIST;items=buildList(PRESET_LIST);render()}};
</script>
</body>
